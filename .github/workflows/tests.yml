name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    name: PHP 8.3

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, intl
          coverage: none

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Dépendances PHP
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Dépendances front et build
        run: |
          npm ci
          npm run build

      - name: Fichier .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Tests
        run: php artisan test
